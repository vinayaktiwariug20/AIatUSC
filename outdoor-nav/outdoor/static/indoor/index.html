<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doorstep · Inside</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#e2e2de;--card:#fafaf7;--tile:#fff;--ink:#1b2220;--dim:#5b6561;--line:#d2d6d1;--brand:#8b1e2c;--ok:#08734d;--route:#0a8f5f;--you:#1a66d6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

/* ---------- layout: the 3D view on top and the panel under it; side by side on wide or short-and-wide screens */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.stage{position:relative;flex:0 0 44%;min-height:220px;overflow:hidden;background:var(--bg)}
.panel{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--card);border-top:1px solid var(--line);padding:18px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.inner{max-width:760px;margin:0 auto}
body.walking .stage{flex:1 1 0}
body.walking .panel{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px),(orientation:landscape) and (max-height:560px){
  .app{flex-direction:row-reverse}
  .stage{flex:1 1 0;min-width:0;min-height:0}
  .panel,body.walking .panel{flex:0 0 clamp(320px,38vw,460px);border-top:0;border-right:1px solid var(--line);padding-top:calc(22px + env(safe-area-inset-top));padding-right:18px;padding-left:calc(18px + env(safe-area-inset-left))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- the 3D view and what floats on it */
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:600;letter-spacing:.02em;color:#2b3038;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.08);padding:1px 6px;border-radius:9px;white-space:nowrap}
.lab.pin{transform:translate(-50%,-150%);color:#fff;border-color:transparent;font-size:12px;padding:2px 8px}
.lab.start{background:var(--you)}
.lab.end{background:var(--brand)}
.chip{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));max-width:min(62%,300px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 11px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chip .dim{font-size:10.5px;letter-spacing:.06em;color:var(--dim)}
.chip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip a{color:var(--brand);font-size:12.5px;text-decoration:none;display:inline-block;padding:2px 0}
@media (max-width:639px),(max-height:560px){.chip .dim{display:none}}
.stagebar{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:10px;display:flex;gap:8px;align-items:stretch}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg button{appearance:none;border:0;background:none;font-weight:650;font-size:14px;color:var(--ink);padding:0 13px;min-height:44px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.icon{appearance:none;display:grid;place-items:center;width:44px;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer;color:var(--ink)}
.seg button:focus-visible,.icon:focus-visible,.chip a:focus-visible{outline:3px solid var(--you);outline-offset:-3px}
body.walking .chip,body.walking .stagebar,body.walking #labels{display:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(226,226,222,.88);z-index:5;padding:16px}
#loading .box{width:min(300px,82%);text-align:center}
#loading .dim{color:var(--dim);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
#more{position:absolute;left:0;top:0;height:3px;width:0;background:var(--ok);z-index:6}

/* ---------- the panel */
h1{margin:0;font-size:24px;line-height:1.15;font-weight:750;letter-spacing:-.015em;outline:none}
h2{margin:18px 0 8px;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.sub{margin:4px 0 0;color:var(--dim);font-size:16px}
.hint{margin:16px 0 0;color:var(--dim);font-size:14px}
#notice{margin:0 0 12px;padding:9px 12px;border-radius:12px;background:#f7ecec;color:var(--brand);font-size:14px}
.link{appearance:none;border:0;background:none;padding:0 2px;min-height:44px;color:var(--brand);font-weight:650;font-size:14.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.link:focus-visible,.btn:focus-visible,.primary:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.dot{flex:none;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.14)}
.dot.you{background:var(--you)}
.dot.dest{background:var(--brand)}
.crumb{display:flex;align-items:center;gap:9px;margin:-6px 0 8px;font-size:14.5px;color:var(--dim)}
.crumb .grow{flex:1;min-width:0}
.crumb b{color:var(--ink);font-weight:650}
#pickBack{display:block;margin:-10px 0 2px}

.spot{appearance:none;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%;text-align:left;background:var(--tile);border:1.5px solid var(--line);border-radius:16px;padding:7px 7px 11px;cursor:pointer;transition:border-color .12s,transform .12s}
.spot:hover{border-color:#8f9994}
.spot:active{transform:scale(.985)}
.spot:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.spot[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.shot{display:block;aspect-ratio:2/1;border-radius:10px;overflow:hidden;background:linear-gradient(100deg,#e3e5e0 40%,#eef0ec 50%,#e3e5e0 60%) 0 0/300% 100%;animation:shimmer 1.6s linear infinite}
.shot.ready{animation:none;background:#dfe1dc}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.shot{animation:none}.spot{transition:none}}
.spot .t{display:block;margin:9px 5px 0;font-weight:700;font-size:16px;line-height:1.2;letter-spacing:-.005em}
.spot .s{display:block;margin:3px 5px 0;font-size:13.5px;line-height:1.3;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{min-height:44px}

.ends{margin:14px 0 0;border:1.5px solid var(--line);border-radius:16px;background:var(--tile)}
.end{display:flex;align-items:center;gap:10px;padding:8px 12px}
.end+.end{border-top:1px solid var(--line)}
.end .mini{flex:none;width:64px;height:32px;border-radius:7px;object-fit:cover;background:#dfe1dc}
.endtext{flex:1;min-width:0}
.endtext .k{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.endtext b{display:block;font-weight:650;font-size:15px;line-height:1.25}
.primary{appearance:none;display:block;width:100%;margin-top:12px;min-height:50px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn{appearance:none;min-height:46px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--tile);font-weight:650;font-size:15px;cursor:pointer}
ol{margin:0;padding-left:22px}
ol li{margin:7px 0;padding-left:2px}
#wStep{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
#wLeft{min-height:1.4em}
#wSeek{display:block;width:100%;margin:8px 0 6px;accent-color:var(--route);min-height:40px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
</style>

<body>
<div class="app">
  <section class="stage" id="stage" aria-label="3D map">
    <canvas id="view" aria-label="3D view of the building. Drag to turn, pinch to zoom."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="chip"><span class="dim">DOORSTEP · INSIDE</span><b id="bname">Building</b><a href="/" id="back">← Back to the map</a></div>
    <div class="stagebar">
      <button type="button" class="icon" id="recenter" aria-label="Recenter the view" title="Recenter">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="5.2"/><path d="M10 1.8v3M10 15.2v3M1.8 10h3M15.2 10h3"/></svg>
      </button>
      <div class="seg" role="group" aria-label="Floor shown">
        <button type="button" data-floor="1" aria-pressed="false">Floor 1</button>
        <button type="button" data-floor="2" aria-pressed="false">Floor 2</button>
        <button type="button" data-floor="0" aria-pressed="true">Both</button>
      </div>
    </div>
    <div id="loading"><div class="box"><b id="loadTitle">Loading the building</b><div class="dim" id="loadText">Starting…</div><div class="bar"><i id="loadBar"></i></div></div></div>
    <div id="more" hidden></div>
  </section>

  <main class="panel" id="panel">
    <div class="inner">
      <div id="notice" role="status" hidden></div>

      <!-- choosing where you are, or where you are going -->
      <div id="vPick">
        <button type="button" class="link" id="pickBack" hidden>← Back</button>
        <div class="crumb" id="crumb" hidden>
          <span class="dot you"></span>
          <span class="grow">You are at <b id="crumbName"></b></span>
          <button type="button" class="link" id="crumbChange">Change</button>
        </div>
        <h1 id="pickTitle" tabindex="-1">Where are you now?</h1>
        <p class="sub" id="pickSub">Pick the spot that matches what you see.</p>
        <section id="rooms" hidden><h2>Rooms</h2><div class="chips" id="roomList"></div></section>
        <div id="spots"></div>
        <p class="hint" id="pickHint"></p>
      </div>

      <!-- the route -->
      <div id="vRoute" hidden>
        <h1 id="summary" tabindex="-1" aria-live="polite"></h1>
        <p class="sub" id="via" hidden></p>
        <div class="ends">
          <div class="end">
            <span class="dot you"></span><img class="mini" id="fromMini" alt="" hidden>
            <div class="endtext"><span class="k">From</span><b id="fromName"></b></div>
            <button type="button" class="link" id="changeFrom" aria-label="Change where you are">Change</button>
          </div>
          <div class="end">
            <span class="dot dest"></span><img class="mini" id="toMini" alt="" hidden>
            <div class="endtext"><span class="k">To</span><b id="toName"></b></div>
            <button type="button" class="link" id="changeTo" aria-label="Change the destination">Change</button>
          </div>
        </div>
        <button type="button" class="primary" id="walkBtn">Preview the walk</button>
        <div id="stepsBox"><h2>Steps</h2><ol id="steps"></ol></div>
      </div>

      <!-- first-person preview -->
      <div id="vWalk" hidden>
        <div id="wStep" aria-live="polite"></div>
        <div class="sub" id="wLeft"></div>
        <input type="range" id="wSeek" min="0" max="1000" value="0" aria-label="Position along the route">
        <div class="btnrow">
          <button type="button" class="btn" id="wPlay">Pause</button>
          <button type="button" class="btn" id="wExit">Exit preview</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// If the viewer script cannot start (opened as a file, or a script failed to download), say so instead of loading forever.
(function () {
  function stop(msg) {
    if (window.__indoorStarted) return;
    document.getElementById('loadTitle').textContent = 'The 3D viewer could not start';
    document.getElementById('loadText').textContent = msg;
    document.getElementById('loadBar').parentElement.hidden = true;
  }
  if (location.protocol === 'file:') { stop('Open this page through the site, not as a file. Locally: start the server and go to http://localhost:8787/indoor/'); return; }
  addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') stop('A script did not download. Check the connection and reload.');
  }, true);
  setTimeout(function () { stop('It is taking too long to start. Check the connection and reload.'); }, 15000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {route, describe, snapToGraph, findPlace, placeEnd, formatDuration} from './nav.mjs';

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const fail = msg => { $('loadText').textContent = msg; $('loadBar').parentElement.hidden = true; };

let B, S;
try {
  [B, S] = await Promise.all([fetch('building.json').then(r => r.json()), fetch('scene/scene.json').then(r => r.json())]);
} catch (e) { fail('Could not load the building data.'); throw e; }
window.__indoorStarted = true;
const H = B.storey_height, NAV = B.nav, FLOOR_Y = {1: 0, 2: H};
$('bname').textContent = B.name;
// What this page calls things where it differs from building.json: the two breezeways are the building's entrances.
const RENAME = {
  places: {'entrance': 'Left entrance, front', 'entrance-courtyard': 'Left entrance, courtyard side',
    'breezeway-right': 'Right entrance, front', 'breezeway-right-courtyard': 'Right entrance, courtyard side'},
  areas: {'the entrance breezeway': 'the left entrance', 'the right breezeway': 'the right entrance'},
  labels: {'Entrance': 'Left entrance'},
};
for (const p of B.places) p.name = RENAME.places[p.id] || p.name;
for (const n of Object.values(NAV.nodes)) n.area = RENAME.areas[n.area] || n.area;
for (const l of B.labels) l.text = RENAME.labels[l.text] || l.text;
B.labels.push({text: 'Right entrance', x: 50.8, y: 0.3, z: 19.6, floors: [1, 2]});
if (qs.get('building')) $('back').href = '/?to=' + encodeURIComponent(qs.get('building'));

// ---------------------------------------------------------------- renderer, camera
const stage = $('stage'), canvas = $('view');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'}); }
catch (e) { fail('This browser cannot show 3D here.'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color().setRGB(226 / 255, 226 / 255, 222 / 255, THREE.SRGBColorSpace);
const OVERVIEW_FOV = 38, WALK_FOV = 70, EYE = 1.55;
const camera = new THREE.PerspectiveCamera(OVERVIEW_FOV, 1, 0.3, 900);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, {enableDamping: true, dampingFactor: 0.12, maxPolarAngle: 1.47, minDistance: 4, maxDistance: 260, screenSpacePanning: false, zoomSpeed: 1.2});
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d7d0, 2.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(-30, 60, 40); scene.add(sun);

const rgb = (r, g, b) => new THREE.Color().setRGB(r / 255, g / 255, b / 255, THREE.SRGBColorSpace);
const SURF = {hall: rgb(200, 190, 172), tile: rgb(206, 203, 192), paving: rgb(126, 102, 82), stairhall: rgb(214, 211, 202)};
const floors = {1: new THREE.Group(), 2: new THREE.Group()};
scene.add(floors[1], floors[2]);

function box(x0, z0, x1, z1, y0, y1, material) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return m;
}
// ground, the building outline from the exit plan, floor plates, the blocked middle and the unscanned markers
scene.add(box(-900, -900, 900, 900, -0.5, -0.2, new THREE.MeshBasicMaterial({color: rgb(226, 226, 222)})));
for (const o of B.outline) scene.add(box(o.x0, o.z0, o.x1, o.z1, -0.2, -0.17, new THREE.MeshBasicMaterial({color: rgb(213, 214, 209)})));
for (const p of B.plates) {
  const top = FLOOR_Y[p.floor] - 0.05;
  floors[p.floor].add(box(p.x0, p.z0, p.x1, p.z1, top - (p.floor === 1 ? 0.11 : 0.33), top, new THREE.MeshBasicMaterial({color: SURF[p.surface]})));
}
const SOLID = {blocked: new THREE.MeshLambertMaterial({color: rgb(203, 206, 210)}), unscanned: new THREE.MeshLambertMaterial({color: rgb(170, 186, 202)})};
for (const s of B.solids) floors[s.floor].add(box(s.x0, s.z0, s.x1, s.z1, s.y0, s.y1, SOLID[s.kind]));

// ---------------------------------------------------------------- labels
const labelLayer = $('labels'), labels = [];
function addLabel(text, pos, floorsShown, cls) {
  const el = document.createElement('span');
  el.className = 'lab' + (cls ? ' ' + cls : '');
  el.textContent = text;
  labelLayer.append(el);
  const l = {el, pos: new THREE.Vector3(pos.x, pos.y, pos.z), floors: floorsShown, detail: false, pin: /\bpin\b/.test(cls || ''), w: 0, h: 0};
  labels.push(l);
  return l;
}
for (const l of B.labels) addLabel(l.text, {x: l.x, y: l.y + 0.4, z: l.z}, l.floors).detail = !!l.detail;

// ---------------------------------------------------------------- floor switch
let floorMode = 0, floorChosenByUser = false;
function setFloor(mode, byUser) {
  floorMode = mode;
  if (byUser) floorChosenByUser = true;
  floors[1].visible = mode !== 2;
  floors[2].visible = mode !== 1;
  for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', String(Number(b.dataset.floor) === mode));
}
for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => setFloor(Number(b.dataset.floor), true));
const floorVisible = f => floorMode === 0 || floorMode === f;

// ---------------------------------------------------------------- camera framing
let walk = null;                                                   // set while the first-person view is on
let vw = 0, vh = 0, sized = false;                                 // size of the 3D view in CSS pixels
const pins = [];
// Pin dots stay about 22 px across whatever the size of the view or the lens.
const sizePins = () => { const s = 22 / vh * 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2); for (const p of pins) p.dot.scale.setScalar(s); };
// First-person lens: 70° tall, opened up on tall narrow screens (to 84° at most) so the view across does not get too tight.
const walkFov = () => THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(34)) / camera.aspect)), WALK_FOV, 84);
const VIEW_DIR = new THREE.Vector3(0, 0.74, 0.67).normalize();     // from the front, looking toward the courtyard
let lastFrame = null;
const _f = new THREE.Vector3();
// Put the camera where the given points fill about `fill` of the view, keeping the direction it is looking from.
function frame(points, fill = 0.86) {
  lastFrame = [points, fill];
  if (walk || !sized) return;                                      // page not laid out yet (hidden tab): framed on the first resize
  const bb = new THREE.Box3().setFromPoints(points), c = bb.getCenter(new THREE.Vector3());
  const dir = camera.position.clone().sub(controls.target);
  const use = dir.lengthSq() > 1 ? dir.normalize() : VIEW_DIR;
  const usable = Math.max(0.5, (vh - 110) / vh);                   // the chip and the floor buttons sit over the top and bottom edges
  let d = Math.max(6, bb.getSize(_f).length() / 2) / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2);
  for (let i = 0; i < 5; i++) {                                    // start from the bounding sphere, then tighten to what the points cover on screen
    camera.position.copy(c).addScaledVector(use, d);
    camera.lookAt(c); camera.updateMatrixWorld();
    let m = 0;
    for (const p of points) { _f.copy(p).project(camera); m = Math.max(m, Math.abs(_f.x), Math.abs(_f.y) / usable); }
    d = THREE.MathUtils.clamp(d * m / fill, controls.minDistance + 2, controls.maxDistance);
  }
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(use, d);
  controls.update();
}
const buildingPoints = () => B.plates.flatMap(p => [new THREE.Vector3(p.x0, 0, p.z0), new THREE.Vector3(p.x1, H + 3, p.z1)]);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!(w > 0 && h > 0) || (w === vw && h === vh)) return;
  vw = w; vh = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (walk) camera.fov = walkFov();
  camera.updateProjectionMatrix();
  sizePins();
  if (!sized) { sized = true; if (lastFrame) frame(...lastFrame); }   // first real size: frame what was asked for while hidden
  renderer.render(scene, camera);                                  // resizing clears the canvas: redraw before the browser paints
}
camera.position.copy(VIEW_DIR).multiplyScalar(120);
frame(buildingPoints());
resize();
new ResizeObserver(resize).observe(stage);

// ---------------------------------------------------------------- route drawing and the pins
// Everything drawn on top of the building lives in one group, so it can be hidden while the card pictures are taken.
const overlay = new THREE.Group();
scene.add(overlay);
const chev = document.createElement('canvas');
chev.width = 128; chev.height = 64;
{ const g = chev.getContext('2d');
  g.fillStyle = '#0a8f5f'; g.fillRect(0, 0, 128, 64);
  g.strokeStyle = '#ffffff'; g.lineWidth = 11; g.lineJoin = 'miter'; g.lineCap = 'butt';

  [floors[1].visible, floors[2].visible, overlay.visible] = keep;

}
const thumbQueue = [], thumbLevel = new Map();
function takeThumbs(max = 2) {
  for (let n = 0; n < max && thumbQueue.length; n++) {
    const id = thumbQueue[0], c = snapshot(viewOf(B.places.find(p => p.id === id)));
    if (!c) return;                                                // the view is too small right now: try again next frame
    thumbQueue.shift();
    c.toBlob(blob => {
      if (!blob) return;
      const old = thumbUrl.get(id);
      thumbUrl.set(id, URL.createObjectURL(blob));
      for (const img of document.querySelectorAll('img[data-thumb]')) if (img.dataset.thumb === id) setThumb(img, id);
      if (old) setTimeout(() => URL.revokeObjectURL(old), 1000);

  }
}

// ---------------------------------------------------------------- load the scans
const small = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && !(navigator.deviceMemory >= 8);
function shrink(tex, size) {
  const img = tex.image;
  if (!img || img.width <= size) return;
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size);

}
const loader = new GLTFLoader(), got = {};
const startFloor = ends.from ? endPos(ends.from).floor : 1;

let failed = 0;
// The notice over the 3D view goes away as soon as the floor you start on is in; the rest keeps loading under a thin bar.
const first = order.filter(s => s.parts.some(p => p.floor === startFloor)), firstBytes = first.reduce((a, s) => a + s.bytes, 0);
const loadedKeys = new Set();
const progress = () => {
  const done = Object.values(got).reduce((a, b) => a + b, 0);
  const firstDone = first.reduce((a, s) => a + Math.min(got[s.key] || 0, s.bytes), 0);
  $('loadBar').style.width = Math.min(100, 100 * firstDone / firstBytes).toFixed(1) + '%';
  $('loadText').textContent = `${(firstDone / 1e6).toFixed(1)} of ${(firstBytes / 1e6).toFixed(1)} MB`;
  $('more').style.width = Math.min(100, 100 * done / S.bytes).toFixed(1) + '%';
};
const floorIn = f => S.scans.every(s => loadedKeys.has(s.key) || !s.parts.some(p => p.floor === f));
function arrived(key) {
  loadedKeys.add(key);
  if (!$('loading').hidden && first.every(s => loadedKeys.has(s.key))) { $('loading').hidden = true; $('more').hidden = false; }
  // a card's picture is taken once its own floor is in, and once more when the whole building is
  const all = loadedKeys.size === S.scans.length;
  for (const p of B.places) {
    const level = all ? 2 : floorIn(NAV.nodes[p.node].floor) ? 1 : 0;
    if (level <= (thumbLevel.get(p.id) || 0)) continue;

  }
}
const queue = order.slice();
async function worker() {
  for (let s; (s = queue.shift());) {
    try {
      const gltf = await loader.loadAsync('scene/' + s.file, ev => { got[s.key] = ev.loaded; progress(); });
      got[s.key] = s.bytes; progress();
      for (const node of [...gltf.scene.children]) {
        const f = /_F2$/.test(node.name) ? 2 : 1;
        node.traverse(m => {
          if (!m.isMesh) return;
          m.geometry.computeBoundingBox(); m.geometry.computeBoundingSphere();   // measured from the vertices, not trusted from the file
          const map = m.material.map;
          if (map) { if (small) shrink(map, 1024); map.anisotropy = 4; }
          m.material = new THREE.MeshBasicMaterial({map, side: THREE.FrontSide});   // back faces hidden: the building reads as a cut-away
        });
        floors[f].add(node);
      }
    } catch (e) { failed++; console.error('scan failed to load', s.file, e); }
    arrived(s.key);
  }
}
Promise.all([worker(), worker(), worker()]).then(() => {
  $('loading').hidden = true;
  $('more').hidden = true;
  if (failed) { $('notice').hidden = false; $('notice').textContent = `${failed} part${failed > 1 ? 's' : ''} of the building did not load. Routes still work.`; }
});

// ---------------------------------------------------------------- frame loop
const v = new THREE.Vector3();
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);

  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  chevTex.offset.x -= dt * 0.9;
  if (thumbQueue.length) takeThumbs();
  if (walk) stepWalk(dt); else controls.update();
  renderer.render(scene, camera);
  if (walk) return;
  // place the labels; one that would cover an earlier one is left out
  const taken = [];
  for (const l of labels) {
    if (l.el.hidden) continue;
    v.copy(l.pos).project(camera);
    let show = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && l.floors.some(floorVisible) && !(l.detail && floorMode === 0);
    if (show) {
      const x = (v.x + 1) / 2 * vw, y = (1 - v.y) / 2 * vh;
      if (!l.w) { l.el.style.display = ''; l.w = l.el.offsetWidth; l.h = l.el.offsetHeight; }
      const r = {x0: x - l.w / 2 - 2, x1: x + l.w / 2 + 2, y0: y - l.h * (l.pin ? 1.5 : 0.5) - 2, y1: y + l.h * (l.pin ? -0.5 : 0.5) + 2};
      show = !taken.some(t => r.x0 < t.x1 && r.x1 > t.x0 && r.y0 < t.y1 && r.y1 > t.y0);
      if (show) { taken.push(r); l.el.style.left = x.toFixed(1) + 'px'; l.el.style.top = y.toFixed(1) + 'px'; }
    }

}
requestAnimationFrame(tick);
window.__indoor = {scene, camera, controls, setEnd, setFloor, ends, building: B, startWalk, stopWalk, mode, snapshot, viewOf, thumbUrl,
  get walk() { return walk; }, get route() { return current; }, get thumbsPending() { return thumbQueue.length; }};
</script>
