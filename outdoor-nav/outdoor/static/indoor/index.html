<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Doorstep · JMC Inside</title>
  <link rel="stylesheet" href="./indoor.css">
  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
<main id="app">
  <section class="stage" aria-label="JMC indoor map">
    <canvas id="view" aria-label="3D building and navigation route"></canvas>
    <div id="loading" role="status">Loading the JMC building…</div>
    <div id="floors" class="modes" role="group" aria-label="Map floor">
      <button type="button" data-floor="1" aria-pressed="false">Floor 1</button>
      <button type="button" data-floor="2" aria-pressed="true">Floor 2</button>
    </div>
  </section>
  <section id="panel">
    <header><div><div class="dim">DOORSTEP · JMC INSIDE</div><h1>Indoor directions</h1></div><a id="back" href="/">← Outdoor map</a></header>
    <p id="status" role="status" aria-live="polite">Reading your navigation details…</p>
    <div id="selection" class="card" hidden>
      <h2>Choose your location</h2>
      <div class="fields">
        <label for="start-select">Start<select id="start-select"><option value="">Choose your current location</option></select></label>
        <label for="dest-select">Destination<select id="dest-select"><option value="">Choose a destination</option></select></label>
      </div>
      <button id="start-route" type="button" class="primary" disabled>Start indoor navigation</button>
    </div>
    <section id="route" class="card" hidden>
      <h2 id="route-title"></h2><p id="route-sub" class="dim"></p>
      <ol id="steps" class="steps" aria-label="Directions"></ol>
      <div class="row wrap"><button type="button" id="btn-play" class="primary">Play</button><label class="sr" for="pos">Position along the route</label><input type="range" id="pos" min="0" max="1000" value="0"><output id="pos-out" for="pos"></output></div>
      <div class="row wrap"><div class="modes" role="group" aria-label="View"><button type="button" id="btn-walk" aria-pressed="true">Walk view</button><button type="button" id="btn-map" aria-pressed="false">Map view</button></div><button type="button" id="btn-change">Review locations</button></div>
    </section>
    <p id="sample-link" class="dim" hidden><a href="/indoor/">Open Sample test locations</a> (starts a separate test; your event link is unchanged).</p>
  </section>
</main>
<noscript>Indoor navigation requires JavaScript. <a href="/">Return to the outdoor map.</a></noscript>
<script type="module">
  import('./app.js').then(({startApp}) => startApp()).catch(error => {
    document.getElementById('status').textContent = 'Indoor navigation could not start. ' + error.message;
    document.getElementById('status').classList.add('error');
    document.getElementById('loading').textContent = 'The viewer is unavailable. Check your connection and reload.';
  });
</script>
</body>
</html>
